<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Seoul Transit Arrival Monitor for Meta Ray-Ban Display">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>Transit MRBD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="screen">
    <!-- Header / Status Bar -->
    <header class="header">
      <div class="title" id="screen-title">내 주변 정류장/역</div>
      <div class="status-indicator" id="status-bar">GPS 탐색 중...</div>
    </header>

    <!-- Main Content Area (Fixed 600x600, No Scrolling) -->
    <main id="content-area" class="content">
      <!-- Dynamic list inserted via app.js -->
    </main>

    <!-- Footer Controls & Hints -->
    <footer class="footer">
      <span class="hint" id="nav-hint">▲▼ 이동 | Pinch/Enter 선택</span>
      <span class="page-indicator" id="page-num">1/1</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
