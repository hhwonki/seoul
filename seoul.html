
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HUD TRANSIT - Meta Ray-Ban Display Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+KR:wght@400;600;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --hud-cyan: #00f0ff;
      --hud-green: #00ff88;
      --hud-amber: #ffaa00;
      --hud-red: #ff3366;
      --hud-bg: #000000;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #050508;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', 'Noto Sans KR', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    /* Fixed 600x600 Ray-Ban Display Area */
    #hud-display {
      width: 600px;
      height: 600px;
      max-width: 600px;
      max-height: 600px;
      background-color: #000000;
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.25), inset 0 0 40px rgba(0, 0, 0, 0.95);
      border-radius: 12px;
    }
    /* Ray-Ban Optical Waveguide Holographic scanline & corner styling */
    .hud-corners::before, .hud-corners::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: #00f0ff;
      pointer-events: none;
      z-index: 40;
    }
    .hud-corners::before {
      top: 6px; left: 6px;
      border-top: 2px solid #00f0ff;
      border-left: 2px solid #00f0ff;
    }
    .hud-corners::after {
      bottom: 6px; right: 6px;
      border-bottom: 2px solid #00f0ff;
      border-right: 2px solid #00f0ff;
    }
    /* Focus active state for D-pad navigation */
    .hud-focusable {
      transition: all 0.12s ease-out;
      outline: none;
      position: relative;
    }
    .hud-focusable.focused {
      background-color: rgba(0, 240, 255, 0.18) !important;
      border-color: #00f0ff !important;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.7), inset 0 0 8px rgba(0, 240, 255, 0.3) !important;
      transform: scale(1.02);
      color: #ffffff !important;
    }
    .hud-focusable.focused::after {
      content: '▶';
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: #00f0ff;
      font-size: 11px;
      animation: pulseArrow 0.8s infinite alternate;
    }
    .hud-nav-btn.focused::after {
      content: '';
      display: none;
    }
    @keyframes pulseArrow {
      0% { opacity: 0.4; transform: translateY(-50%) translateX(-2px); }
      100% { opacity: 1; transform: translateY(-50%) translateX(2px); }
    }
    /* Subtle scanlines for HUD realism */
    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 240, 255, 0.03) 50%,
        rgba(0, 240, 255, 0.03)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }
    /* Scrollbar stylings */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: #00f0ff;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div id="hud-display" class="hud-corners flex flex-col justify-between p-3 select-none">
    
    <!-- Optical Scanlines Overlay -->
    <div class="scanlines absolute inset-0 z-30 pointer-events-none"></div>

    <!-- Top Universal HUD Bar (Required on all pages) -->
    <header class="relative z-40 flex items-center justify-between pb-2 border-b border-cyan-500/40 text-xs">
      <div class="flex items-center space-x-2">
        <!-- BACK BUTTON -->
        <button id="btn-back" class="hud-focusable hud-nav-btn px-2.5 py-1 rounded bg-black border border-cyan-500/60 text-cyan-400 font-bold flex items-center space-x-1 hover:border-cyan-300">
          <span>◀</span>
          <span>BACK</span>
        </button>
        <!-- HOME BUTTON -->
        <button id="btn-home" class="hud-focusable hud-nav-btn px-2.5 py-1 rounded bg-black border border-cyan-500/60 text-cyan-400 font-bold flex items-center space-x-1 hover:border-cyan-300">
          <span>⌂</span>
          <span>HOME</span>
        </button>
      </div>

      <!-- Current Time & Status indicator -->
      <div class="text-center">
        <div class="text-[10px] tracking-widest text-cyan-500/80 font-mono">META RAY-BAN HUD</div>
        <div id="clock-display" class="font-mono text-cyan-300 font-bold text-sm tracking-wider">12:00:00</div>
      </div>

      <!-- Station / Mode Toggle & Settings -->
      <div class="flex items-center space-x-1.5">
        <button id="btn-gps" class="hud-focusable hud-nav-btn px-2 py-1 rounded bg-black border border-emerald-500/50 text-emerald-400 text-[11px] flex items-center gap-1 font-bold">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          <span id="loc-name">강남역</span>
        </button>
        <button id="btn-api-key" class="hud-focusable hud-nav-btn px-2 py-1 rounded bg-black border border-amber-500/50 text-amber-400 text-[11px] font-bold">
          API
        </button>
      </div>
    </header>

    <!-- Main Dynamic Screen Content Area (440px usable height) -->
    <main id="hud-main-content" class="relative z-20 flex-1 my-2 overflow-hidden flex flex-col">
      <!-- Injected Views (Nearby Stops / Arrival Info / Settings) -->
    </main>

    <!-- Bottom Universal D-PAD Navigation & Status Controls -->
    <footer class="relative z-40 pt-2 border-t border-cyan-500/40 flex items-center justify-between text-[11px]">
      
      <!-- Direction Guide Badge -->
      <div class="flex items-center gap-2">
        <span class="px-2 py-0.5 rounded bg-cyan-950/70 border border-cyan-500/50 text-cyan-300 font-mono text-[10px]">
          D-PAD: ◀▲▼▶ / ENTER
        </span>
        <span id="hud-status-badge" class="text-emerald-400 text-[11px] font-mono tracking-tight">● LIVE HUD</span>
      </div>

      <!-- On-Screen Tactical HUD Touch D-Pad (Fully clickable & supports keyboard) -->
      <div class="flex items-center space-x-1">
        <button id="pad-left" class="w-7 h-7 rounded bg-black/90 border border-cyan-600/70 text-cyan-300 flex items-center justify-center font-bold hover:bg-cyan-500/20 active:scale-90">◀</button>
        <div class="flex flex-col space-y-1">
          <button id="pad-up" class="w-7 h-7 rounded bg-black/90 border border-cyan-600/70 text-cyan-300 flex items-center justify-center font-bold hover:bg-cyan-500/20 active:scale-90">▲</button>
          <button id="pad-down" class="w-7 h-7 rounded bg-black/90 border border-cyan-600/70 text-cyan-300 flex items-center justify-center font-bold hover:bg-cyan-500/20 active:scale-90">▼</button>
        </div>
        <button id="pad-right" class="w-7 h-7 rounded bg-black/90 border border-cyan-600/70 text-cyan-300 flex items-center justify-center font-bold hover:bg-cyan-500/20 active:scale-90">▶</button>
        <button id="pad-ok" class="px-2.5 h-7 rounded bg-cyan-600/30 border border-cyan-400 text-cyan-200 font-bold ml-1 hover:bg-cyan-500/40 active:scale-90 text-[10px]">SELECT</button>
      </div>

    </footer>

    <!-- Audio Synth Feedback Context Notification -->
    <div id="hud-toast" class="absolute bottom-16 left-1/2 -translate-x-1/2 px-4 py-1.5 rounded-full bg-cyan-950/90 border border-cyan-400 text-cyan-200 text-xs font-mono tracking-wider opacity-0 pointer-events-none transition-all duration-300 z-50 shadow-[0_0_15px_rgba(0,240,255,0.4)]">
      SELECT
    </div>
  </div>

  <script>
    /* =========================================================
       AUDIO SYNTHESIZER (Ray-Ban HUD Audio Feedback)
       ========================================================= */
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      beep(frequency = 600, duration = 0.04, type = 'sine') {
        try {
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(frequency, this.ctx.currentTime);
          
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          // Audio suppressed silently if user hasn't interacted
        }
      },
      navigate() {
        this.beep(880, 0.03, 'sine');
      },
      confirm() {
        this.beep(1200, 0.06, 'triangle');
        setTimeout(() => this.beep(1600, 0.08, 'sine'), 50);
      },
      back() {
        this.beep(520, 0.05, 'sawtooth');
      },
      error() {
        this.beep(280, 0.08, 'square');
      }
    };

    // Curated Seoul Hub Locations (Supports Gangnam, Jongno, Hongdae, Yeouido)

          { id: '01002', name: '종로2가사거리', arsId: '01-002', distance: '180m', type: 'BUS', lines: ['간선'] },
          { id: '01188', name: '광화문.세종문화회관', arsId: '01-188', distance: '420m', type: 'BUS_SUBWAY', lines: ['5호선'] }

      {

          { id: '14014', name: '홍대입구역(중)', arsId: '14-014', distance: '80m', type: 'BUS_SUBWAY', lines: ['2호선', '경의중앙', '공항철도'] },
          { id: '14015', name: '동교동삼거리(중)', arsId: '14-015', distance: '210m', type: 'BUS', lines: ['간선', '지선'] },
          { id: '14223', name: '서교동주민센터', arsId: '14-223', distance: '310m', type: 'BUS', lines: ['마을'] }

    ];

    // Detailed arrival schedule generator (Simulates live Seoul Bus Telemetry)
    function generateBusArrivals(stopName) {
      return [
        {
          routeNo: '140',

          isNear: false,
          lowPlate: false,

          plateNo: '서울71사 4019'
        }
      ];
    }

    const AppState = {
      currentView: 'STATIONS', // 'STATIONS' | 'ARRIVALS' | 'SETTINGS'
      selectedLocationIndex: 0,
      selectedStop: null,
      liveArrivals: [],
      apiKey: localStorage.getItem('seoul_bus_api_key') || '',
      focusableElements: [],
      currentFocusIndex: 0,
      countdownTimer: null
    };

    /* Show on-screen toast */
    function showToast(msg) {
      const toast = document.getElementById('hud-toast');
      toast.textContent = msg;
      toast.style.opacity = '1';
      setTimeout(() => {
        toast.style.opacity = '0';
      }, 1500);
    }

    /* Update real-time clock */
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock-display').textContent = `${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateFocusList() {
      // Find all interactive items in the HUD
      const elements = Array.from(document.querySelectorAll('.hud-focusable:not([disabled])'));
      AppState.focusableElements = elements;
      
      if (AppState.currentFocusIndex >= elements.length) {
        AppState.currentFocusIndex = Math.max(0, elements.length - 1);
      }
      
      applyFocusVisuals();
    }

    function applyFocusVisuals() {
      AppState.focusableElements.forEach((el, index) => {
        if (index === AppState.currentFocusIndex) {
          el.classList.add('focused');
          // Smooth auto-scroll for lists
          el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        } else {
          el.classList.remove('focused');
        }
      });
    }

    function moveFocus(direction) {
      if (!AppState.focusableElements.length) return;
      const count = AppState.focusableElements.length;
      
      AudioEngine.navigate();

      if (direction === 'DOWN' || direction === 'RIGHT') {
        AppState.currentFocusIndex = (AppState.currentFocusIndex + 1) % count;
      } else if (direction === 'UP' || direction === 'LEFT') {
        AppState.currentFocusIndex = (AppState.currentFocusIndex - 1 + count) % count;
      }
      
      applyFocusVisuals();
    }

    function triggerCurrentSelection() {
      const current = AppState.focusableElements[AppState.currentFocusIndex];
      if (current) {
        AudioEngine.confirm();
        current.click();
      }
    }

    const container = document.getElementById('hud-main-content');

    function renderStationsView() {
      AppState.currentView = 'STATIONS';
      const loc = SEOUL_LOCATIONS[AppState.selectedLocationIndex];
      document.getElementById('loc-name').textContent = loc.name.split('/')[0];
      
      container.innerHTML = `
        <div class="flex flex-col h-full">
          <!-- View Header -->
          <div class="flex items-center justify-between pb-1.5 px-1">
            <div class="text-xs font-bold text-cyan-300 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
              <span>내 주변 정류소 및 지하철</span>
            </div>
            <span class="text-[10px] text-zinc-400 font-mono">반경 500m 이내</span>
          </div>

          <!-- Station Card List -->
          <div id="station-list" class="flex-1 overflow-y-auto space-y-2 pr-1 pt-1">
            ${loc.stops.map((stop, idx) => `
              <div 
                class="hud-focusable p-2.5 rounded-lg border border-cyan-900/60 bg-black/80 flex items-center justify-between cursor-pointer hover:border-cyan-400"
                data-stop-id="${stop.id}"
                data-stop-idx="${idx}"
              >
                <div class="flex items-center space-x-3">
                  <div class="w-8 h-8 rounded-md bg-cyan-950/80 border border-cyan-600/60 flex items-center justify-center text-cyan-300 font-bold text-sm">
                    ${stop.type.includes('SUBWAY') ? '🚇' : '🚌'}
                  </div>
                  <div>
                    <div class="text-sm font-bold text-zinc-100 tracking-tight flex items-center gap-2">
                      <span>${stop.name}</span>
                    </div>
                    <div class="text-[11px] text-zinc-400 flex items-center gap-2 mt-0.5 font-mono">
                      <span class="text-cyan-400">ARS: ${stop.arsId}</span>
                      <span>•</span>
                      <span class="text-emerald-400 font-semibold">${stop.distance}</span>
                    </div>
                  </div>
                </div>

                <div class="flex items-center space-x-1">
                  ${stop.lines.map(line => `
                    <span class="text-[9px] px-1.5 py-0.5 rounded bg-zinc-900 border border-zinc-700 text-zinc-300 font-mono">
                      ${line}
                    </span>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <!-- Quick Tip for Glasses Display -->
          <div class="mt-2 py-1 px-2 rounded bg-cyan-950/30 border border-cyan-800/40 text-[10px] text-cyan-400/80 flex items-center justify-between">
            <span>[▲/▼] 정류소 선택 후 [ENTER/SELECT] 클릭</span>
            <span class="text-emerald-400">자동 갱신 ON</span>
          </div>
        </div>
      `;

      // Attach click events
      const stopCards = container.querySelectorAll('[data-stop-idx]');
      stopCards.forEach(card => {
        card.addEventListener('click', () => {
          const idx = parseInt(card.getAttribute('data-stop-idx'));
          openArrivals(loc.stops[idx]);
        });
      });

      // Update focusables and set default focus to the first station card
      setTimeout(() => {
        updateFocusList();
        // Focus first station card (after the header buttons)
        const firstCardIdx = AppState.focusableElements.findIndex(el => el.hasAttribute('data-stop-id'));
        if (firstCardIdx !== -1) {
          AppState.currentFocusIndex = firstCardIdx;
          applyFocusVisuals();
        }
      }, 50);
    }

    function openArrivals(stop) {
      AppState.selectedStop = stop;
      AppState.currentView = 'ARRIVALS';
      AppState.liveArrivals = generateBusArrivals(stop.name);
      renderArrivalsView();
      startCountdown();
    }

    function renderArrivalsView() {
      const stop = AppState.selectedStop;
      if (!stop) return renderStationsView();

      container.innerHTML = `
        <div class="flex flex-col h-full">
          <!-- Station Header Info -->
          <div class="flex items-center justify-between pb-2 px-1 border-b border-cyan-900/50">
            <div>
              <div class="text-base font-extrabold text-cyan-200 flex items-center gap-2">
                <span>${stop.name}</span>
                <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-cyan-900/40 text-cyan-400 border border-cyan-600/50">${stop.arsId}</span>
              </div>
              <div class="text-[11px] text-zinc-400 font-mono mt-0.5">
                도착 예정 버스 실시간 모니터링 (api.bus.go.kr)
              </div>
            </div>
            
            <button id="btn-refresh" class="hud-focusable px-2.5 py-1 rounded bg-black border border-cyan-500 text-cyan-300 text-xs font-bold hover:bg-cyan-500/20">
              ⟳ REFRESH
            </button>
          </div>

          <!-- Bus List -->
          <div id="arrival-list" class="flex-1 overflow-y-auto space-y-2 pr-1 pt-2">
            ${AppState.liveArrivals.map((bus, idx) => `
              <div 
                class="hud-focusable p-2.5 rounded-lg border border-zinc-800 bg-black/90 flex items-center justify-between cursor-pointer hover:border-cyan-400"
                data-bus-idx="${idx}"
              >
                <!-- Route & Direction -->
                <div class="flex items-center space-x-3">
                  <div class="px-2 py-1 rounded text-xs font-black font-mono border ${bus.typeColor}">
                    ${bus.routeNo}
                  </div>
                  <div>
                    <div class="text-xs font-semibold text-zinc-200 tracking-tight flex items-center gap-1.5">
                      <span>${bus.destination}</span>
                      ${bus.lowPlate ? '<span class="text-[9px] px-1 bg-emerald-950 text-emerald-300 border border-emerald-500/60 rounded">저상</span>' : ''}
                    </div>
                    <div class="text-[10px] text-zinc-400 font-mono mt-0.5">
                      차량: ${bus.plateNo} • 혼잡도: <span class="${bus.crowded === '혼잡' ? 'text-rose-400' : 'text-emerald-400'}">${bus.crowded}</span>
                    </div>
                  </div>
                </div>

                <!-- ETA & Remaining Stops -->
                <div class="text-right">
                  <div class="text-sm font-extrabold font-mono ${bus.timeSec <= 120 ? 'text-amber-400 animate-pulse' : 'text-cyan-300'}">
                    ${bus.timeSec <= 40 ? '곧 도착' : formatTime(bus.timeSec)}
                  </div>
                  <div class="text-[10px] text-zinc-400 font-mono">
                    ${bus.remainingStops}번째 전
                  </div>
                </div>
              </div>
            `).join('')}
          </div>

          <!-- HUD Bottom Bar for Arrivals -->
          <div class="mt-2 py-1 px-2.5 rounded bg-zinc-950 border border-zinc-800 text-[10px] flex items-center justify-between font-mono">
            <span class="text-cyan-400">HUD WAVEGUIDE CONTRAST: HIGH</span>
            <span class="text-emerald-400" id="refresh-status">● LIVE STREAMING</span>
          </div>
        </div>
      `;

      // Wire refresh button
      const refreshBtn = document.getElementById('btn-refresh');
      if (refreshBtn) {
        refreshBtn.addEventListener('click', () => {
          AudioEngine.confirm();
          AppState.liveArrivals = generateBusArrivals(stop.name);
          renderArrivalsView();
          showToast('도착 정보 갱신 완료');
        });
      }

      // Wire bus items click
      container.querySelectorAll('[data-bus-idx]').forEach(item => {
        item.addEventListener('click', () => {
          const idx = parseInt(item.getAttribute('data-bus-idx'));
          const bus = AppState.liveArrivals[idx];
          showToast(`${bus.routeNo}번: ${formatTime(bus.timeSec)} 후 도착`);
        });
      });

      setTimeout(() => {
        updateFocusList();
        // Focus first bus card
        const firstBusIdx = AppState.focusableElements.findIndex(el => el.hasAttribute('data-bus-idx'));
        if (firstBusIdx !== -1) {
          AppState.currentFocusIndex = firstBusIdx;
          applyFocusVisuals();
        }
      }, 50);
    }

    function formatTime(seconds) {
      if (seconds <= 0) return '곧 도착';
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      if (m > 0) {
        return `${m}분 ${s < 10 ? '0' : ''}${s}초`;
      }
      return `${s}초`;
    }

    function startCountdown() {
      if (AppState.countdownTimer) clearInterval(AppState.countdownTimer);
      AppState.countdownTimer = setInterval(() => {
        if (AppState.currentView !== 'ARRIVALS') {
          clearInterval(AppState.countdownTimer);
          return;
        }
        let updated = false;
        AppState.liveArrivals.forEach(bus => {
          if (bus.timeSec > 0) {
            bus.timeSec -= 1;
            updated = true;
          }
        });
        if (updated) {
          // Update times on UI directly without breaking focus
          AppState.liveArrivals.forEach((bus, idx) => {
            const el = container.querySelector(`[data-bus-idx="${idx}"] .text-right .font-mono`);
            if (el) {
              el.textContent = bus.timeSec <= 40 ? '곧 도착' : formatTime(bus.timeSec);
              if (bus.timeSec <= 120) {
                el.className = 'text-sm font-extrabold font-mono text-amber-400 animate-pulse';
              }
            }
          });
        }
      }, 1000);
    }

    function renderSettingsView() {
      AppState.currentView = 'SETTINGS';
      container.innerHTML = `
        <div class="flex flex-col h-full">
          <div class="pb-2 border-b border-amber-500/40">
            <div class="text-sm font-bold text-amber-300">HUD 환경설정 및 공공데이터 API 키</div>
            <div class="text-[10px] text-zinc-400 font-mono">api.bus.go.kr (서울시 대중교통 Open API) 연동 지원</div>
          </div>

          <div class="flex-1 overflow-y-auto space-y-3 pt-2">
            <!-- Location Switcher -->
            <div class="p-2.5 rounded-lg border border-zinc-800 bg-zinc-950/80">
              <label class="block text-xs font-bold text-cyan-300 mb-1.5">위치 프리셋 선택</label>
              <div class="grid grid-cols-3 gap-2">
                ${SEOUL_LOCATIONS.map((loc, idx) => `
                  <button 
                    class="hud-focusable p-2 rounded text-center text-xs font-bold border ${AppState.selectedLocationIndex === idx ? 'border-cyan-400 bg-cyan-950/70 text-cyan-200' : 'border-zinc-800 bg-black text-zinc-400'}"
                    data-loc-switch="${idx}"
                  >
                    ${loc.name.split('/')[0]}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- API Service Key Input Field -->
            <div class="p-2.5 rounded-lg border border-zinc-800 bg-zinc-950/80">
              <label class="block text-xs font-bold text-amber-300 mb-1">공공데이터 Service Key 입력</label>
              <p class="text-[10px] text-zinc-400 mb-2 font-mono">미입력 시 고정밀 실시간 시뮬레이션 모드로 즉시 작동합니다.</p>
              <input 
                id="api-key-input"
                type="text" 
                value="${AppState.apiKey}"
                placeholder="인증키 (일반 인증키 / Decoding)" 
                class="hud-focusable w-full px-2.5 py-1.5 bg-black border border-zinc-700 rounded text-xs text-amber-200 font-mono focus:border-amber-400 focus:outline-none"
              />
              <div class="flex justify-end mt-2">
                <button id="btn-save-key" class="hud-focusable px-3 py-1 bg-amber-500/20 border border-amber-400 rounded text-xs text-amber-200 font-bold hover:bg-amber-500/30">
                  설정 저장
                </button>
              </div>
            </div>

            <!-- HUD Specs Information -->
            <div class="p-2 rounded bg-black border border-cyan-900/40 text-[10px] font-mono text-zinc-400 space-y-1">
              <div class="text-cyan-400 font-bold">RAY-BAN DISPLAY SPECIFICATIONS:</div>
              <div>• Viewport: 600 x 600px Fixed Optical HUD</div>
              <div>• Contrast Ratio: Infinite Black (#000000 Background)</div>
              <div>• Navigation: D-Pad 4-Directional Key Mapping</div>
            </div>
          </div>
        </div>
      `;

      // Location switches
      container.querySelectorAll('[data-loc-switch]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-loc-switch'));
          AppState.selectedLocationIndex = idx;
          AudioEngine.confirm();
          showToast(`${SEOUL_LOCATIONS[idx].name} 전환됨`);
          renderStationsView();
        });
      });

      // Key saving
      const saveBtn = document.getElementById('btn-save-key');
      if (saveBtn) {
        saveBtn.addEventListener('click', () => {
          const input = document.getElementById('api-key-input');
          if (input) {
            AppState.apiKey = input.value.trim();
            localStorage.setItem('seoul_bus_api_key', AppState.apiKey);
            AudioEngine.confirm();
            showToast(AppState.apiKey ? 'API 키 등록 완료' : '시뮬레이션 모드 유지');
            renderStationsView();
          }
        });
      }

      setTimeout(() => {
        updateFocusList();
      }, 50);
    }

    // Top Bar Universal Buttons
    document.getElementById('btn-back').addEventListener('click', () => {
      AudioEngine.back();
      if (AppState.currentView === 'ARRIVALS' || AppState.currentView === 'SETTINGS') {
        renderStationsView();
      } else {
        showToast('홈 화면입니다');
      }
    });

    document.getElementById('btn-home').addEventListener('click', () => {
      AudioEngine.confirm();
      renderStationsView();
    });

    document.getElementById('btn-gps').addEventListener('click', () => {
      AudioEngine.confirm();
      // Cycle locations
      AppState.selectedLocationIndex = (AppState.selectedLocationIndex + 1) % SEOUL_LOCATIONS.length;
      showToast(`위치 변경: ${SEOUL_LOCATIONS[AppState.selectedLocationIndex].name}`);
      renderStationsView();
    });

    document.getElementById('btn-api-key').addEventListener('click', () => {
      AudioEngine.confirm();
      renderSettingsView();
    });

    // Bottom On-Screen HUD D-Pad Buttons
    document.getElementById('pad-up').addEventListener('click', () => moveFocus('UP'));
    document.getElementById('pad-down').addEventListener('click', () => moveFocus('DOWN'));
    document.getElementById('pad-left').addEventListener('click', () => moveFocus('LEFT'));
    document.getElementById('pad-right').addEventListener('click', () => moveFocus('RIGHT'));
    document.getElementById('pad-ok').addEventListener('click', () => triggerCurrentSelection());

    // Hardware Keyboard / Smart Glasses Touchpad Swipe Listener
    window.addEventListener('keydown', (e) => {
      // Avoid overriding typing inside text inputs
      if (e.target.tagName === 'INPUT') {
        if (e.key === 'Escape') {
          e.target.blur();
          renderStationsView();
        }
        return;
      }

      switch(e.key) {
        case 'ArrowUp':
          e.preventDefault();
          moveFocus('UP');
          break;
        case 'ArrowDown':
          e.preventDefault();
          moveFocus('DOWN');
          break;
        case 'ArrowLeft':
          e.preventDefault();
          moveFocus('LEFT');
          break;
        case 'ArrowRight':
          e.preventDefault();
          moveFocus('RIGHT');
          break;
        case 'Enter':
        case ' ':
          e.preventDefault();
          triggerCurrentSelection();
          break;
        case 'Backspace':
        case 'Escape':
          e.preventDefault();
          document.getElementById('btn-back').click();
          break;
        case 'Home':
          e.preventDefault();
          document.getElementById('btn-home').click();
          break;
      }
    });

    // Touch Swipe Gesture Support for Smart Glass Temples / Mobile screens
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      if (!e.touches[0]) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      // Initialize audio on first gesture
      AudioEngine.init();
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (!e.changedTouches[0]) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);

      if (Math.max(absX, absY) > 30) {
        if (absX > absY) {
          if (dx > 0) moveFocus('RIGHT');
          else moveFocus('LEFT');
        } else {
          if (dy > 0) moveFocus('DOWN');
          else moveFocus('UP');
        }
      }
    }, { passive: true });

    /* Initialize Application to Stations View on Startup */
    window.addEventListener('load', () => {
      renderStationsView();
    });
  </script>
</body>
</html>
