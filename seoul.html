  <style>
    /* Prevent root scrolling, lock to HUD viewport */
    body {
      background-color: #050505;
      color: #00E5FF;
      font-family: 'JetBrains Mono', 'Noto Sans KR', sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Fixed 600x600 Ray-Ban Display Simulation */
    #hud-screen {
      width: 600px;
      height: 600px;
      max-width: 600px;
      max-height: 600px;
      background-color: #000000;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.25), inset 0 0 15px rgba(0, 229, 255, 0.15);
      border: 2px solid #00e5ff66;
      border-radius: 18px;
    }

    /* Optical Scanline & Reticle overlay */
    .hud-scanline {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 229, 255, 0.04) 50%,
        rgba(0, 229, 255, 0.04)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }

    .hud-glow-text {
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
    }
    .hud-glow-green {
      text-shadow: 0 0 8px rgba(0, 230, 118, 0.65);
    }
    .hud-glow-amber {
      text-shadow: 0 0 8px rgba(255, 179, 0, 0.65);
    }

    /* Glass Optics Vignette */
    .hud-vignette {
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.85);
      pointer-events: none;
    }

    /* Custom Slim Scrollbar for HUD cards */
    .hud-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .hud-scroll::-webkit-scrollbar-track {
      background: rgba(0, 229, 255, 0.05);
    }
    .hud-scroll::-webkit-scrollbar-thumb {
      background: #00e5ff66;
      border-radius: 2px;
    }

    /* Touch / D-pad active state animations */
    .hud-btn:active, .hud-btn-active {
      transform: scale(0.96);
      background-color: rgba(0, 229, 255, 0.25) !important;
    }

    /* Blinking recording/live dot */
    @keyframes hud-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .animate-pulse-fast {
      animation: hud-blink 1.2s infinite ease-in-out;
    }
  </style>
</head>

    function computeDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // metres
      const φ1 = lat1 * Math.PI/180;
      const φ2 = lat2 * Math.PI/180;
      const Δφ = (lat2-lat1) * Math.PI/180;
      const Δλ = (lon2-lon1) * Math.PI/180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    function refreshNearbyStops() {
      State.stops = SEOUL_TRANSIT_NODES.map(stop => {
        const dist = computeDistance(
          State.userCoords.lat, State.userCoords.lng,
          stop.lat, stop.lng
        );
        return { ...stop, distance: dist };
      }).sort((a, b) => a.distance - b.distance);
    }

    function showToast(msg) {
      const toast = document.getElementById('hud-toast');
      toast.innerText = msg;
      toast.style.opacity = '1';
      setTimeout(() => {
        toast.style.opacity = '0';
      }, 1600);
    }

    function renderStopsListView() {
      refreshNearbyStops();

      const filteredStops = State.stops.filter(stop => {
        if (State.filter === 'BUS') return stop.type === 'BUS';
        if (State.filter === 'SUBWAY') return stop.type === 'SUBWAY';
        return true;
      });

      const html = `
        <div class="flex flex-col h-full">
          
          <!-- Sub-Header / Current Anchor + Distance Range -->
          <div class="flex items-center justify-between pb-2 border-b border-[#00e5ff33] mb-2 font-mono">
            <div>
              <div class="text-[10px] text-hud-muted tracking-wide uppercase">HUD NEARBY TRANSIT</div>
              <div class="text-white font-bold text-xs flex items-center gap-1">
                <svg class="w-3.5 h-3.5 text-hud-cyan inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <span>${State.userCoords.name} 반경 500m</span>
              </div>
            </div>
            <div class="text-right">
              <span class="text-hud-cyan text-[11px] font-bold tracking-tight">${filteredStops.length}개소 감지</span>
            </div>
          </div>

          <!-- Quick Filter Segment Control -->
          <div class="grid grid-cols-3 gap-1 mb-2">
            <button onclick="setFilter('ALL')" class="py-1 px-2 text-center text-xs font-bold rounded ${State.filter === 'ALL' ? 'bg-hud-cyan text-black shadow-[0_0_8px_#00e5ff]' : 'bg-[#081920] text-gray-300 border border-[#00e5ff22]'}">
              전체 [ALL]
            </button>
            <button onclick="setFilter('BUS')" class="py-1 px-2 text-center text-xs font-bold rounded ${State.filter === 'BUS' ? 'bg-hud-cyan text-black shadow-[0_0_8px_#00e5ff]' : 'bg-[#081920] text-gray-300 border border-[#00e5ff22]'}">
              버스정류소
            </button>
            <button onclick="setFilter('SUBWAY')" class="py-1 px-2 text-center text-xs font-bold rounded ${State.filter === 'SUBWAY' ? 'bg-hud-cyan text-black shadow-[0_0_8px_#00e5ff]' : 'bg-[#081920] text-gray-300 border border-[#00e5ff22]'}">
              지하철역
            </button>
          </div>

          <!-- Scrollable Stops List -->
          <div class="flex-1 overflow-y-auto hud-scroll space-y-2 pr-1">
            ${filteredStops.length === 0 ? `
              <div class="flex flex-col items-center justify-center h-48 text-center text-hud-muted">
                <span class="text-2xl mb-1">📡</span>
                <p class="text-xs">반경 내 정류장이 없습니다.</p>
              </div>
            ` : filteredStops.map((stop, idx) => {
              const isBus = stop.type === 'BUS';
              const badgeColor = isBus ? 'border-hud-cyan text-hud-cyan bg-hud-cyan/10' : 'border-emerald-400 text-emerald-400 bg-emerald-400/10';
              const icon = isBus ? '🚌' : '🚇';
              return `
                <div onclick="selectStop('${stop.id}')" class="hud-btn cursor-pointer bg-[#051419] hover:bg-[#0b242d] active:bg-[#00e5ff22] border border-[#00e5ff44] rounded-lg p-2.5 flex items-center justify-between transition-all group">
                  <div class="flex items-center space-x-2.5 min-w-0">
                    <div class="w-9 h-9 rounded-md flex items-center justify-center text-base ${isBus ? 'bg-hud-cyan/15 text-hud-cyan' : 'bg-emerald-500/15 text-emerald-400'} border border-current">
                      ${icon}
                    </div>
                    <div class="truncate">
                      <div class="flex items-center space-x-1.5">
                        <span class="text-white font-bold text-sm tracking-tight truncate group-hover:text-hud-cyan">${stop.name}</span>
                      </div>
                      <div class="flex items-center space-x-2 text-[11px] font-mono text-gray-400 mt-0.5">
                        <span class="text-hud-amber font-semibold">${stop.arsId}</span>
                        <span>•</span>
                        <span class="text-hud-green font-bold">${stop.distance}m</span>
                      </div>
                    </div>
                  </div>
                  
                  <div class="flex items-center pl-2">
                    <span class="text-hud-cyan font-mono text-xs font-bold px-2 py-1 rounded bg-[#09222c] border border-hud-cyan/40">
                      도착조회 &gt;
                    </span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- Glanceable Bottom Tip for Smart Glasses -->
          <div class="pt-2 text-[10px] text-hud-muted font-mono flex items-center justify-between">
            <span>[터치 또는 스와이프로 정류장 선택]</span>
            <span class="text-hud-green">자동갱신: ${State.countdown}s</span>
          </div>

        </div>
      `;

      document.getElementById('view-container').innerHTML = html;
    }

    function renderArrivalsDetailView() {
      if (!State.selectedStop) {
        navigateTo('STOPS_LIST');
        return;
      }

      const stop = State.selectedStop;
      const arrivals = generateDynamicArrivals(stop);
      const isSubway = stop.type === 'SUBWAY';

      const html = `
        <div class="flex flex-col h-full">
          
          <!-- Selected Station Header -->
          <div class="bg-[#05171d] border border-hud-cyan/40 rounded-lg p-2.5 mb-2 shadow-[0_0_12px_rgba(0,229,255,0.1)]">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2 min-w-0">
                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${isSubway ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-hud-cyan/20 text-hud-cyan border border-hud-cyan/50'}">
                  ${isSubway ? 'METRO' : 'BUS STOP'}
                </span>
                <h2 class="text-base font-extrabold text-white tracking-wide truncate hud-glow-text">${stop.name}</h2>
              </div>
              <span class="text-xs font-mono font-bold text-hud-amber bg-black/60 px-2 py-0.5 rounded border border-hud-amber/30">
                ${stop.arsId}
              </span>
            </div>
            
            <div class="flex items-center justify-between text-[11px] font-mono text-gray-300 mt-1 pt-1 border-t border-[#00e5ff22]">
              <span class="text-hud-muted">정류소ID: ${stop.stId}</span>
              <span class="text-hud-green font-semibold">도보 약 ${Math.max(1, Math.round(stop.distance / 70))}분 (${stop.distance}m)</span>
            </div>
          </div>

          <!-- Section Label -->
          <div class="flex items-center justify-between text-[11px] font-bold text-hud-cyan px-1 mb-1 font-mono">
            <span>실시간 도착 정보 (REAL-TIME ETA)</span>
            <span class="text-[10px] text-gray-400 font-normal">갱신: ${State.countdown}s</span>
          </div>

          <!-- Real-time Arrivals List (Scrollable) -->
          <div class="flex-1 overflow-y-auto hud-scroll space-y-2 pr-1">
            ${arrivals.map((item, index) => {
              if (isSubway) {
                const isArriving = item.isArrive1;
                return `
                  <div class="bg-[#06141a] border border-[#00e5ff33] rounded-lg p-2.5 flex items-center justify-between">
                    <div class="flex items-center space-x-2.5">
                      <div class="w-10 h-10 rounded-md bg-[#0b2832] border border-hud-green flex items-center justify-center font-extrabold text-emerald-400 text-xs">
                        ${item.busRouteNm}
                      </div>
                      <div>
                        <div class="text-white font-bold text-sm flex items-center gap-1.5">
                          <span>${item.direction}</span>
                        </div>
                        <div class="text-[11px] font-mono text-gray-400 mt-0.5">
                          <span>${item.sectionNm}</span>
                          <span class="text-hud-muted">|</span>
                          <span class="${item.reride_Num1 === '혼잡' ? 'text-hud-red' : 'text-hud-cyan'}">${item.reride_Num1}</span>
                        </div>
                      </div>
                    </div>
                    <div class="text-right">
                      <div class="text-base font-extrabold font-mono ${isArriving ? 'text-hud-amber hud-glow-amber animate-pulse-fast' : 'text-emerald-400'}">
                        ${item.arrmsg1}
                      </div>
                      <div class="text-[10px] font-mono text-gray-400">${item.traTime1}</div>
                    </div>
                  </div>
                `;
              }

              // Bus Arrival Card with Low-Floor and Next Bus Details
              const isUrgent = item.traTime1 <= 150 || item.arrmsg1.includes('곧');
              return `
                <div class="bg-[#06141a] border ${isUrgent ? 'border-hud-amber/60 bg-[#161204]' : 'border-[#00e5ff33]'} rounded-lg p-2.5 transition-all">
                  <div class="flex items-center justify-between">
                    
                    <!-- Route Badge and Direction -->
                    <div class="flex items-center space-x-2">
                      <span class="px-2 py-0.5 rounded font-extrabold text-sm font-mono tracking-tight text-white" style="background-color: ${item.routeColor || '#00B0FF'};">
                        ${item.rtNm}
                      </span>
                      <span class="text-xs font-semibold text-gray-200 truncate max-w-[170px]">
                        ${item.adirection}
                      </span>
                      ${item.busType1 && item.busType1.includes('저상') ? `
                        <span class="text-[9px] font-mono px-1 py-0.2 rounded border border-emerald-400 text-emerald-400 bg-emerald-400/10">
                          저상
                        </span>
                      ` : ''}
                    </div>

                    <!-- 1st Arrival Primary Tag -->
                    <div class="text-right">
                      <div class="text-sm font-extrabold font-mono ${isUrgent ? 'text-hud-amber hud-glow-amber font-black' : 'text-hud-cyan'}">
                        ${item.arrmsg1}
                      </div>
                    </div>
                  </div>

                  <!-- Next Bus Info & Crowdedness Sub-strip -->
                  <div class="mt-2 pt-1.5 border-t border-[#00e5ff1f] flex items-center justify-between text-[11px] font-mono text-gray-400">
                    <div class="flex items-center space-x-2">
                      <span class="text-[10px] text-hud-muted">혼잡도:</span>
                      <span class="font-bold ${item.reride_Num1 === '혼잡' ? 'text-hud-red' : item.reride_Num1 === '보통' ? 'text-hud-amber' : 'text-hud-green'}">
                        ${item.reride_Num1 || '여유'}
                      </span>
                    </div>

                    <div class="flex items-center space-x-1.5 text-[10px]">
                      <span class="text-hud-muted">다음:</span>
                      <span class="text-gray-300 font-mono">${item.arrmsg2 || '도착정보 없음'}</span>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- Bottom Action Bar inside Detail view -->
          <div class="pt-2 flex space-x-2">
            <button onclick="navigateTo('STOPS_LIST')" class="flex-1 py-1.5 bg-[#082029] hover:bg-[#0c2e3b] border border-[#00e5ff44] rounded text-xs font-bold text-hud-cyan flex items-center justify-center space-x-1">
              <span>← 주변 정류소 목록</span>
            </button>
            <button onclick="triggerLiveRefresh()" class="px-3 py-1.5 bg-[#082029] border border-hud-amber/50 rounded text-xs font-bold text-hud-amber flex items-center space-x-1">
              <span>즉시 갱신 ⚡</span>
            </button>
          </div>

        </div>
      `;

      document.getElementById('view-container').innerHTML = html;
    }

    function navigateTo(targetView) {
      State.view = targetView;
      if (State.history[State.history.length - 1] !== targetView) {
        State.history.push(targetView);
      }

      if (targetView === 'STOPS_LIST') {
        renderStopsListView();
      } else if (targetView === 'ARRIVALS_DETAIL') {
        renderArrivalsDetailView();
      }
    }

    function navigateBack() {
      if (State.view === 'ARRIVALS_DETAIL') {
        navigateTo('STOPS_LIST');
        return;
      }
      showToast('MAIN VIEW');
    }

    function selectStop(stopId) {
      const stop = State.stops.find(s => s.id === stopId);
      if (stop) {
        State.selectedStop = stop;
        navigateTo('ARRIVALS_DETAIL');
      }
    }

    function setFilter(filterType) {
      State.filter = filterType;
      renderStopsListView();
    }

    function startAutoRefreshLoop() {
      if (State.timerHandle) clearInterval(State.timerHandle);
      State.countdown = State.refreshIntervalSec;

      State.timerHandle = setInterval(() => {
        if (!State.autoRefresh) return;
        
        State.countdown--;
        if (State.countdown <= 0) {
          triggerLiveRefresh();
          State.countdown = State.refreshIntervalSec;
        }

        // Update clock & UI timers without re-rendering entire tree
        updateClock();
      }, 1000);
    }

    function triggerLiveRefresh() {
      const spinner = document.getElementById('refresh-spinner');
      if (spinner) {
        spinner.classList.add('rotate-180');
        setTimeout(() => spinner.classList.remove('rotate-180'), 500);
      }

      if (State.view === 'ARRIVALS_DETAIL') {
        renderArrivalsDetailView();
      } else {
        renderStopsListView();
      }
      showToast('DATA REFRESHED');
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const clockEl = document.getElementById('hud-clock');
      if (clockEl) clockEl.innerText = `${hours}:${mins}`;
    }

    function setLocationPreset(presetKey) {
      if (presetKey === 'real') {
        if ('geolocation' in navigator) {
          showToast('GPS 검색 중...');
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              State.userCoords = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                name: '현위치 (GPS 실시간)'
              };
              document.getElementById('hud-gps-tag').innerText = 'GPS: LIVE';
              refreshNearbyStops();
              if (State.view === 'STOPS_LIST') renderStopsListView();
              showToast('위치 갱신 완료');
            },
            (err) => {
              showToast('GPS 오류 - 시청으로 대체');
              setLocationPreset('cityhall');
            },
            { timeout: 6000 }
          );
        } else {
          showToast('GPS 미지원 단말');
          setLocationPreset('cityhall');
        }
        return;
      }

      const presets = {
        cityhall: { lat: 37.5665, lng: 126.9780, name: '서울시청 일대' },
        gangnam: { lat: 37.4979, lng: 127.0276, name: '강남역 사거리' },
        jongno: { lat: 37.5704, lng: 126.9918, name: '종로3가 탑골공원' },
        yeouido: { lat: 37.5255, lng: 126.9242, name: '여의도 환승센터' }
      };

      if (presets[presetKey]) {
        State.userCoords = presets[presetKey];
        document.getElementById('hud-gps-tag').innerText = 'GPS: FIX';
        refreshNearbyStops();
        if (State.view === 'STOPS_LIST') renderStopsListView();
        showToast(`위치: ${State.userCoords.name}`);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Universal Ray-Ban Hardware Navigation Buttons
      document.getElementById('btn-nav-back').addEventListener('click', () => {
        navigateBack();
      });

      document.getElementById('btn-nav-home').addEventListener('click', () => {
        navigateTo('STOPS_LIST');
        showToast('HOME VIEW');
      });

      document.getElementById('btn-nav-refresh').addEventListener('click', () => {
        triggerLiveRefresh();
      });

      // Menu Modal Open & Close
      const menuModal = document.getElementById('modal-menu');
      document.getElementById('btn-nav-menu').addEventListener('click', () => {
        menuModal.classList.remove('hidden');
        menuModal.classList.add('flex');
      });

      document.getElementById('btn-close-menu').addEventListener('click', () => {
        menuModal.classList.add('hidden');
        menuModal.classList.remove('flex');
      });

      // Menu Save & Options Handlers
      document.getElementById('btn-save-menu').addEventListener('click', () => {
        const selectedPreset = document.getElementById('select-preset-loc').value;
        const apiKeyVal = document.getElementById('input-api-key').value.trim();

        if (apiKeyVal) {
          State.apiKey = apiKeyVal;
          localStorage.setItem('seoul_bus_api_key', apiKeyVal);
          const badge = document.getElementById('api-mode-badge');
          badge.innerText = 'OPEN API';
          badge.classList.remove('border-hud-amber/60', 'text-hud-amber', 'bg-hud-amber/10');
          badge.classList.add('border-hud-cyan', 'text-hud-cyan', 'bg-hud-cyan/10');
        }

        setLocationPreset(selectedPreset);
        menuModal.classList.add('hidden');
        menuModal.classList.remove('flex');
        showToast('설정 저장 완료');
      });

      // Contrast Toggle
      let highContrast = true;
      document.getElementById('btn-toggle-hud-mode').addEventListener('click', () => {
        highContrast = !highContrast;
        document.getElementById('contrast-status').innerText = highContrast ? 'ULTRA-HIGH [ON]' : 'STANDARD [OFF]';
        document.getElementById('hud-screen').style.filter = highContrast ? 'contrast(1.15) brightness(1.1)' : 'none';
      });

      // Auto Refresh Toggle
      document.getElementById('btn-auto-refresh-toggle').addEventListener('click', () => {
        State.autoRefresh = !State.autoRefresh;
        const el = document.getElementById('auto-refresh-status');
        if (State.autoRefresh) {
          el.innerText = 'ACTIVE';
          el.className = 'text-hud-green font-bold text-xs';
          showToast('자동갱신 켜짐');
        } else {
          el.innerText = 'PAUSED';
          el.className = 'text-hud-red font-bold text-xs';
          showToast('자동갱신 일시정지');
        }
      });

      // Keyboard arrow keys simulation for Ray-Ban Temple / D-Pad
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' || e.key === 'Escape') {
          navigateBack();
        } else if (e.key === 'h' || e.key === 'H') {
          navigateTo('STOPS_LIST');
        } else if (e.key === 'r' || e.key === 'R') {
          triggerLiveRefresh();
        } else if (e.key === 'm' || e.key === 'M') {
          menuModal.classList.toggle('hidden');
          menuModal.classList.toggle('flex');
        }
      });

      // Initial Boot
      updateClock();
      renderStopsListView();
      startAutoRefreshLoop();
    });
  </script>
</body>
</html>
